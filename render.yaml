# Render Blueprint.
#
# `package.json` sits at the repository root, so there is no rootDir to set —
# an earlier value here pointed at a `shubham-landing/` subdirectory that does
# not exist, which fails the build before it starts.
#
# Every page is prerendered, so the app exports to plain files and is served
# from Render's CDN as a static site — no Node process at runtime.
services:
  - type: web
    runtime: static
    name: shubham-landing
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
